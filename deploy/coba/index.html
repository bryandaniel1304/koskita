<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#355DDB">
  <title>Uji Coba KosKita</title>
  <meta name="description" content="Coba aplikasi KosKita langsung dari browser, lalu isi kuesioner pengalaman pengguna.">
  <link rel="icon" type="image/png" href="app/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!--
    Halaman pembungkus uji coba responden. Aplikasi Flutter versi web
    (hasil `flutter build web --base-href /app/`) ada di folder app/ dan
    dimuat lewat iframe: di layar lebar tampil dalam bingkai HP di samping
    panduan, di HP tampil layar penuh dengan bilah panduan tipis di atas.
    Kuesioner SUS ada di backend (/kuesioner) dan sengaja dibuka di tab
    baru, bukan iframe, supaya cookie CSRF Laravel tetap berfungsi.
  -->
  <style>
    :root {
      --brand: #355DDB;
      --brand-dark: #2A4BB8;
      --brand-soft: #EEF2FD;
      --bg: #F4F6FB;
      --surface: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --line: #E2E8F0;
      --done: #16A34A;
      --frame: #0F172A;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --brand: #6F8FF0;
        --brand-dark: #5A7BE0;
        --brand-soft: #1E2A4D;
        --bg: #0B1120;
        --surface: #131C31;
        --text: #E2E8F0;
        --muted: #94A3B8;
        --line: #24304A;
        --done: #4ADE80;
        --frame: #000000;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .5px; color: var(--brand); }
    .brand img { width: 34px; height: 34px; border-radius: 10px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 14px; padding: 14px 18px;
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
      background: var(--brand); color: #fff; transition: background .15s;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn-ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--line); }
    .btn-ghost:hover { background: var(--brand-soft); }

    /* ---------- Panduan ---------- */
    .guide h1 { font-size: 1.6rem; line-height: 1.25; margin: 22px 0 10px; }
    .guide .lead { color: var(--muted); line-height: 1.6; margin: 0 0 22px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .chip { background: var(--brand-soft); color: var(--brand); font-size: .8rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; }

    .steps { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 8px; }
    .step {
      display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    }
    .step input { appearance: none; -webkit-appearance: none; margin: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-content: center; cursor: pointer; font-weight: 800; font-size: .75rem; color: var(--muted); }
    .step input::before { content: attr(data-num); }
    .step input:checked { background: var(--done); border-color: var(--done); color: #fff; }
    .step input:checked::before { content: "✓"; }
    .step label { cursor: pointer; }
    .step strong { display: block; font-size: .95rem; }
    .step span { display: block; color: var(--muted); font-size: .85rem; line-height: 1.5; margin-top: 2px; }
    .step:has(input:checked) strong { text-decoration: line-through; text-decoration-color: var(--muted); }

    .finish { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    .finish p { margin: 0 0 14px; color: var(--muted); font-size: .9rem; line-height: 1.55; }
    .finish p strong { color: var(--text); }
    .finish .btn { width: 100%; }
    .note { color: var(--muted); font-size: .78rem; line-height: 1.5; margin: 16px 0 0; }

    /* ---------- Layar lebar: panduan + bingkai HP ---------- */
    .stage { display: none; }
    @media (min-width: 900px) {
      .stage {
        display: grid; grid-template-columns: minmax(320px, 440px) auto; gap: 56px;
        justify-content: center; align-items: center;
        min-height: 100vh; padding: 32px;
      }
      .stage .guide { max-height: calc(100vh - 64px); overflow-y: auto; padding-right: 6px; }
      .phone {
        /* 390x844 = ukuran layar HP umum; diperkecil kalau jendela pendek */
        --h: min(844px, calc(100vh - 64px));
        height: var(--h); aspect-ratio: 390 / 844;
        background: var(--frame); border-radius: 52px; padding: 12px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, .25), inset 0 0 0 2px #334155;
      }
      .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 40px; background: #fff; display: block; }
      .mobile { display: none !important; }
    }

    /* ---------- HP: aplikasi layar penuh + bilah tipis ---------- */
    .mobile { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .topbar {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .topbar .brand { font-size: .9rem; margin-right: auto; }
    .topbar .brand img { width: 26px; height: 26px; border-radius: 8px; }
    .topbar .btn { padding: 8px 12px; border-radius: 10px; font-size: .8rem; }
    .mobile iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }

    .sheet {
      position: fixed; inset: 0; z-index: 10; display: none;
      background: var(--bg); overflow-y: auto;
      padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .sheet.open { display: block; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; }
    .sheet .guide h1 { font-size: 1.35rem; margin-top: 18px; }
    .close { background: var(--surface); border: 1px solid var(--line); color: var(--text); width: 40px; height: 40px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>
  <template id="guide-template">
    <div class="brand"><img src="app/icons/Icon-192.png" alt="">KOSKITA</div>
    <h1>Uji Coba Aplikasi KosKita</h1>
    <p class="lead">
      Terima kasih sudah bersedia menjadi responden! Kamu akan mencoba aplikasi KosKita langsung dari browser,
      tanpa perlu instal apa pun. Ikuti langkah di bawah, lalu ceritakan pengalamanmu lewat kuesioner singkat.
    </p>
    <div class="meta">
      <span class="chip">± 10–15 menit</span>
      <span class="chip">Tanpa instal aplikasi</span>
    </div>

    <ol class="steps">
      <li class="step"><input type="checkbox" id="s1" data-num="1"><label for="s1"><strong>Daftar akun baru</strong><span>Ketuk “Belum punya akun? Daftar sekarang”, pilih <b>Penyewa Kos</b>, lalu isi nama, email aktif, nomor HP, dan password. Ingat emailnya, nanti dipakai di kuesioner.</span></label></li>
      <li class="step"><input type="checkbox" id="s2" data-num="2"><label for="s2"><strong>Isi profil preferensi</strong><span>Pilih lokasi, kisaran budget, dan fasilitas kos yang kamu cari.</span></label></li>
      <li class="step"><input type="checkbox" id="s3" data-num="3"><label for="s3"><strong>Lihat rekomendasi kos</strong><span>Perhatikan daftar kos yang direkomendasikan untukmu di Beranda.</span></label></li>
      <li class="step"><input type="checkbox" id="s4" data-num="4"><label for="s4"><strong>Buka detail salah satu kos</strong><span>Lihat foto, harga, fasilitas, aturan, dan lokasinya di peta.</span></label></li>
      <li class="step"><input type="checkbox" id="s5" data-num="5"><label for="s5"><strong>Beri rating atau simpan ke Favorit</strong><span>Nilai kos yang sudah kamu lihat, atau simpan yang kamu suka.</span></label></li>
      <li class="step"><input type="checkbox" id="s6" data-num="6"><label for="s6"><strong>Bandingkan kos</strong><span>Di Beranda, ketuk “Bandingkan Kos”, pilih 2–3 kos, lalu lihat perbandingannya.</span></label></li>
      <li class="step"><input type="checkbox" id="s7" data-num="7"><label for="s7"><strong>Jelajahi fitur lain</strong><span>Bebas coba pencarian &amp; filter, peta, atau fitur lain yang menarik buatmu.</span></label></li>
    </ol>

    <div class="finish">
      <p><strong>Sudah selesai mencoba?</strong> Isi kuesioner 10 pernyataan (± 3 menit) memakai email yang sama dengan akun yang kamu daftarkan.</p>
      <a class="btn" href="https://koskita.inovasidigital-si.id/kuesioner" target="_blank" rel="noopener">Isi Kuesioner</a>
    </div>
    <p class="note">Akun dan data yang kamu isi hanya dipakai untuk keperluan penelitian skripsi ini. Tampilan versi browser sama dengan aplikasi Android; fitur khusus HP seperti notifikasi dan sidik jari tidak tersedia di sini.</p>
  </template>

  <!-- Layar lebar -->
  <div class="stage">
    <section class="guide" data-guide></section>
    <div class="phone"><iframe data-app title="Aplikasi KosKita" allow="geolocation; clipboard-write; web-share"></iframe></div>
  </div>

  <!-- HP -->
  <div class="mobile">
    <header class="topbar">
      <div class="brand"><img src="app/icons/Icon-192.png" alt="">KOSKITA</div>
      <button class="btn btn-ghost" type="button" data-open-guide>Panduan</button>
      <a class="btn" href="https://koskita.inovasidigital-si.id/kuesioner" target="_blank" rel="noopener">Kuesioner</a>
    </header>
    <iframe data-app title="Aplikasi KosKita" allow="geolocation; clipboard-write; web-share"></iframe>
  </div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Panduan uji coba">
    <div class="sheet-head">
      <span></span>
      <button class="close" type="button" data-close-guide aria-label="Tutup panduan">✕</button>
    </div>
    <section class="guide" data-guide></section>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'koskita-uji-coba-langkah';
      var wide = window.matchMedia('(min-width: 900px)');

      // Panduan dirender dua kali (panel samping & lembar di HP) dari satu
      // template; id checkbox diberi akhiran supaya label tetap terhubung.
      document.querySelectorAll('[data-guide]').forEach(function (el, i) {
        el.appendChild(document.getElementById('guide-template').content.cloneNode(true));
        el.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
          var label = el.querySelector('label[for="' + cb.id + '"]');
          cb.id = cb.id + '-' + i;
          if (label) label.htmlFor = cb.id;
        });
      });

      // Centang langkah cuma kenyamanan per pengunjung -- aman kalau
      // penyimpanan browser diblokir (mode privat dsb).
      function load() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
      }
      function save(state) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }
      var state = load();
      document.querySelectorAll('.step input').forEach(function (cb) {
        var step = cb.getAttribute('data-num');
        cb.checked = !!state[step];
        cb.addEventListener('change', function () {
          state[step] = cb.checked;
          save(state);
          document.querySelectorAll('.step input[data-num="' + step + '"]').forEach(function (other) { other.checked = cb.checked; });
        });
      });

      // Aplikasi hanya dimuat di SATU iframe (yang terlihat) -- dua instance
      // Flutter sekaligus memboroskan memori HP dan bisa saling menimpa sesi.
      var frames = document.querySelectorAll('iframe[data-app]');
      function mountApp() {
        var active = wide.matches ? frames[0] : frames[1];
        frames.forEach(function (f) {
          var wanted = f === active ? 'app/' : 'about:blank';
          if (f.getAttribute('src') !== wanted) f.setAttribute('src', wanted);
        });
      }
      mountApp();
      if (wide.addEventListener) wide.addEventListener('change', mountApp);

      var SEEN_KEY = 'koskita-uji-coba-panduan-dilihat';
      var sheet = document.querySelector('.sheet');
      document.querySelector('[data-open-guide]').addEventListener('click', function () { sheet.classList.add('open'); });
      document.querySelector('[data-close-guide]').addEventListener('click', function () {
        sheet.classList.remove('open');
        try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
      });

      // Kunjungan pertama di HP: langsung tampilkan panduan dulu.
      var seen = false;
      try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}
      if (!wide.matches && !seen) sheet.classList.add('open');
    })();
  </script>
</body>
</html>
