; Batas PHP khusus KosKita di hosting cPanel (disalin deploy.sh ke document
; root sebagai .user.ini). Akun ini dipakai bersama proyek lain, jadi batas
; tidak diubah lewat PHP Selector global. Unggah foto kos/avatar/QRIS butuh
; batas unggah lebih longgar dari bawaan.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
