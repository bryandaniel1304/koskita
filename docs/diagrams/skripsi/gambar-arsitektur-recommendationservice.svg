.99,496.1769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1325.8826,496.1769 L1325.8826,506.1769 L1335.8826,506.1769 L1325.8826,496.1769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.2827" x="958.99" y="513.2438">Menerapkan strategi switching hybrid</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.7144" x="958.99" y="528.3766">berkomponen weighted (Subbab 2.2.3):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.0864" x="958.99" y="543.5094">Skor_hybrid = alpha x Skor_CB + (1-alpha) x Skor_CF</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.8926" x="958.99" y="558.6422">Cold-start: alpha = 1 otomatis (Skor_CF tidak dihitung).</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="53" id="ent0029"><path d="M953.72,350.5069 L953.72,436.1709 L1285.1712,436.1709 L1285.1712,360.5069 L1275.1712,350.5069 L953.72,350.5069" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1275.1712,350.5069 L1275.1712,360.5069 L1285.1712,360.5069 L1275.1712,350.5069" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.4736" x="959.72" y="367.5738">Data interaksi antarpengguna TIDAK PERNAH</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.2725" x="959.72" y="382.7066">dikirim ke perangkat klien -- seluruh</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.4292" x="959.72" y="397.8394">perhitungan CollaborativeFilter tetap di</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.4512" x="959.72" y="412.9722">server, menjaga konsistensi antara model yang</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.8433" x="959.72" y="428.105">dievaluasi dan model produksi (Subbab 2.9.2).</text></g><!--link flutter to api--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk13"><path d="M373.51,114.9769 C373.51,145.5769 373.51,201.3169 373.51,231.8369" fill="none" id="flutter-to-api" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="373.51,236.8369,377.51,227.8369,373.51,231.8369,369.51,227.8369,373.51,236.8369" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link api to cb--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="28" id="lnk14"><path d="M446.93,255.7369 C461.98,255.7369 475.37,255.7369 475.37,255.7369 C475.37,255.7369 475.37,332.2269 475.37,369.7869" fill="none" id="api-to-cb" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="475.37,374.7869,479.37,365.7869,475.37,369.7869,471.37,365.7869,475.37,374.7869" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link api to cf--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="29" id="lnk15"><path d="M419.21,273.7969 C419.21,306.4469 419.21,370.7369 419.21,370.7369 C419.21,370.7369 561.05,370.7369 653.97,370.7369" fill="none" id="api-to-cf" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="658.97,370.7369,649.97,366.7369,653.97,370.7369,649.97,374.7369,658.97,370.7369" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link cb to combiner--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" data-source-line="30" id="lnk16"><path d="M573.12,411.9669