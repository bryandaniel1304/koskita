org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Paksa Gradle selalu pakai JDK 17 ini, apapun yang dipakai Android Studio
# secara default -- supaya tidak gagal saat IDE memakai JDK bawaan yang
# lebih baru dan belum didukung Gradle 8.10.2.
org.gradle.java.home=C:/Program Files/Microsoft/jdk-17.0.9.8-hotspot
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=true
android.newDsl=true
# Kotlin's relocatable incremental-compilation cache can't compute a
# relative path between the pub-cache (C:) and the project (D:) when
# they sit on different drive letters, so it throws
# "this and base files have different roots" on every build. Turning
# off incremental Kotlin compilation avoids the crash entirely; the
# handful of plugin .kt files here compile fast enough that it doesn't
# matter.
kotlin.incremental=false
